description = "Add your description here"
readme = "README.md"
authors = [
    { name = "n-yoshimura-jp", email = "170519389+n-yoshimura-jp@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langgraph==1.2.24",
    "markitdown[docx,pdf]==0.1.9",
    "msal==1.39.0",
    "numpy==2.5.5",
    "openai==3.59.0",
